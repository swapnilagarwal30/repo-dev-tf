name: Terraform Main Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_WORKING_DIR: environment/test

jobs:
  terraform-main:
    name: Terraform Plan and Apply
    runs-on: self-hosted

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # ============================================================
      # TERRAFORM SETUP
      # ============================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Version
        shell: pwsh
        run: |
          terraform version

      # ============================================================
      # TERRAFORM FORMAT
      # ============================================================

      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: pwsh
        run: |
          terraform fmt -check -recursive

      # ============================================================
      # TERRAFORM INIT
      # ============================================================

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: pwsh
        run: |
          terraform init -input=false

      # ============================================================
      # TERRAFORM VALIDATE
      # ============================================================

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: pwsh
        run: |
          terraform validate

      # ============================================================
      # TERRAFORM PLAN
      # ============================================================

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: pwsh
        run: |
          terraform plan `
            -input=false `
            -out=tfplan

      # ============================================================
      # TERRAFORM APPLY
      # ============================================================

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Terraform Apply"
          Write-Host "Working Directory: $PWD"
          Write-Host "=========================================="

          terraform apply `
            -input=false `
            -auto-approve `
            tfplan

          Write-Host "=========================================="
          Write-Host "Terraform State"
          Write-Host "=========================================="

          terraform state list